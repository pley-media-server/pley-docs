# Builds the site from Pley's docs as Cloudflare will, then type-checks and lints it.
name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      # Fetches Pley's docs, renders the pages and indexes them for search.
      - run: bun run build
      - run: bun run check
      - run: bun run lint
